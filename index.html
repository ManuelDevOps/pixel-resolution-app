<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6fc">
  <title>Pixel Resolution Lab</title>
  <link rel="icon" href="data:,">
  <!-- Apply a stored Cyber choice before the first paint; src/theme.js owns the toggle. -->
  <script>try { if (sessionStorage.getItem('pixel-lab-theme') === 'cyber') document.documentElement.dataset.theme = 'cyber'; } catch { /* Storage may be blocked. */ }</script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Pixel Resolution Lab home"><span class="brand-icon" aria-hidden="true">▦</span><span>PIXEL<span class="brand-accent">LAB</span><small>RESOLUTION EXPLORER</small></span></a>
      <nav class="mode-switch" aria-label="Application mode">
        <button id="explore-tab" class="active" aria-pressed="true">Explore</button>
        <button id="tv-tab" aria-pressed="false">TV Lab</button>
        <button id="jumper-tab" aria-pressed="false">Jumper Lab</button>
      </nav>
      <button id="theme-toggle" type="button">Cyber theme</button>
    </div>
  </header>
  <main class="container">
    <section id="explore" aria-labelledby="explore-title"></section>
    <section id="tv-lab" aria-labelledby="tv-title" hidden></section>
    <section id="jumper-lab" aria-labelledby="jumper-title" hidden></section>
    <footer class="app-footer"><small>&copy; 2026</small> <a href="https://applications4education.com/" target="_blank" rel="noopener noreferrer">Applications 4 Education</a></footer>
  </main>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
